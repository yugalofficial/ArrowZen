# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Use AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ArrowZen build-time configurable values.
# Change ARROWZEN_PACKAGE_NAME before Play Store publishing if you fork this project.
ARROWZEN_PACKAGE_NAME=com.yugalify.arrowzen
ARROWZEN_VERSION_CODE=1
ARROWZEN_VERSION_NAME=1.0.0

# AdMob (Section 33/70, see docs/ADMOB.md). Default OFF: the app builds and
# runs with zero third-party ad-SDK dependency until you opt in.
ARROWZEN_ENABLE_ADMOB=false
ARROWZEN_ADS_ENABLED=false
ARROWZEN_ADMOB_APP_ID=
ARROWZEN_ADMOB_REWARDED_UNIT_ID=
ARROWZEN_ADMOB_INTERSTITIAL_UNIT_ID=
ARROWZEN_ADMOB_BANNER_UNIT_ID=
